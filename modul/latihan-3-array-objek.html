<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 3: Array & Objek</title>
  <link rel="stylesheet" href="modul.css">
</head>
<body>
  <p class="nav"><a href="index.html">&larr; Kembali</a></p>
  <h1>Latihan 3: Array &amp; Objek</h1>

  <h2>Data Mahasiswa</h2>
  <button id="btn-asc">Urut Nama A-Z</button>
  <button id="btn-desc">Urut Nama Z-A</button>
  <button id="btn-semua">Tampilkan Semua</button>
  <button id="btn-atas">Di Atas Rata-rata</button>
  <div class="out" id="info"></div>
  <table>
    <thead><tr><th>Nama</th><th>NIM</th><th>Jurusan</th><th>Nilai</th><th>Aksi</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <h2>Tambah / Ubah Data (CRUD)</h2>
  <input type="text" id="f-nama" placeholder="Nama">
  <input type="text" id="f-nim" placeholder="NIM">
  <input type="text" id="f-jurusan" placeholder="Jurusan">
  <input type="number" id="f-nilai" placeholder="Nilai" min="0" max="100">
  <button id="btn-simpan">Simpan</button>
  <div class="err" id="f-error"></div>

  <script>
    let mahasiswa = [
      { nama: "Budi Santoso", nim: "124140001", jurusan: "Teknik Informatika", nilai: 85 },
      { nama: "Citra Lestari", nim: "124140002", jurusan: "Teknik Informatika", nilai: 92 },
      { nama: "Andi Pratama", nim: "124140003", jurusan: "Teknik Informatika", nilai: 74 },
      { nama: "Dewi Anggraini", nim: "124140004", jurusan: "Teknik Informatika", nilai: 68 },
      { nama: "Eko Wijaya", nim: "124140005", jurusan: "Teknik Informatika", nilai: 88 }
    ];
    let tampilan = "semua";   // semua | atas
    let urutan = null;        // asc | desc | null
    let indexEdit = -1;       // -1 = mode tambah

    const $ = (id) => document.getElementById(id);

    const rataRata = () => mahasiswa.reduce((t, m) => t + m.nilai, 0) / (mahasiswa.length || 1);
    const tertinggi = () => mahasiswa.reduce((maks, m) => (m.nilai > maks.nilai ? m : maks), mahasiswa[0]);

    function render() {
      let data = [...mahasiswa];
      if (tampilan === "atas") data = data.filter((m) => m.nilai > rataRata());
      if (urutan) {
        data.sort((a, b) => a.nama.localeCompare(b.nama) * (urutan === "asc" ? 1 : -1));
      }

      $("tbody").innerHTML = "";
      data.forEach((m) => {
        const idx = mahasiswa.indexOf(m);
        const tr = document.createElement("tr");
        [m.nama, m.nim, m.jurusan, m.nilai].forEach((v) => {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        });
        const aksi = document.createElement("td");
        const btnEdit = document.createElement("button");
        btnEdit.textContent = "Ubah";
        btnEdit.addEventListener("click", () => mulaiEdit(idx));
        const btnHapus = document.createElement("button");
        btnHapus.textContent = "Hapus";
        btnHapus.className = "danger";
        btnHapus.addEventListener("click", () => { mahasiswa.splice(idx, 1); render(); });
        aksi.append(btnEdit, " ", btnHapus);
        tr.appendChild(aksi);
        $("tbody").appendChild(tr);
      });

      if (mahasiswa.length === 0) {
        $("info").textContent = "Belum ada data.";
      } else {
        $("info").textContent =
          `Nilai tertinggi: ${tertinggi().nama} (${tertinggi().nilai}) | Rata-rata: ${rataRata().toFixed(2)}`;
      }
    }

    function mulaiEdit(idx) {
      const m = mahasiswa[idx];
      $("f-nama").value = m.nama;
      $("f-nim").value = m.nim;
      $("f-jurusan").value = m.jurusan;
      $("f-nilai").value = m.nilai;
      indexEdit = idx;
      $("btn-simpan").textContent = "Perbarui";
    }

    $("btn-simpan").addEventListener("click", () => {
      const nama = $("f-nama").value.trim();
      const nim = $("f-nim").value.trim();
      const jurusan = $("f-jurusan").value.trim();
      const nilai = Number($("f-nilai").value);

      if (!nama || !nim || !jurusan || $("f-nilai").value === "" || nilai < 0 || nilai > 100) {
        $("f-error").textContent = "Semua field wajib diisi dan nilai harus 0-100.";
        return;
      }
      $("f-error").textContent = "";

      const data = { nama, nim, jurusan, nilai };
      if (indexEdit === -1) mahasiswa.push(data);
      else mahasiswa[indexEdit] = data;

      indexEdit = -1;
      $("btn-simpan").textContent = "Simpan";
      ["f-nama", "f-nim", "f-jurusan", "f-nilai"].forEach((id) => ($(id).value = ""));
      render();
    });

    $("btn-asc").addEventListener("click", () => { urutan = "asc"; render(); });
    $("btn-desc").addEventListener("click", () => { urutan = "desc"; render(); });
    $("btn-semua").addEventListener("click", () => { tampilan = "semua"; render(); });
    $("btn-atas").addEventListener("click", () => { tampilan = "atas"; render(); });

    render();
  </script>
</body>
</html>
