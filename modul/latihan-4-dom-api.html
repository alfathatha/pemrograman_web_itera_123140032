<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 4: DOM, localStorage & Fetch API</title>
  <link rel="stylesheet" href="modul.css">
</head>
<body>
  <p class="nav"><a href="index.html">&larr; Kembali</a></p>
  <h1>Latihan 4: DOM, localStorage &amp; Fetch API</h1>
  <button id="btn-dark">Toggle Dark Mode</button>

  <h2>1. Form Validasi + localStorage (Data Mahasiswa)</h2>
  <input type="text" id="m-nama" placeholder="Nama (min 3 karakter)">
  <input type="text" id="m-nim" placeholder="NIM (9 digit angka)">
  <button id="btn-tambah-mhs">Tambah</button>
  <div class="err" id="m-error"></div>
  <ul id="daftar-mhs"></ul>

  <h2>2. Todo List (tambah, hapus, tandai selesai)</h2>
  <input type="text" id="todo-input" placeholder="Tugas baru">
  <button id="btn-todo">Tambah</button>
  <ul id="daftar-todo"></ul>

  <h2>3. Fetch API: Search &amp; Pagination</h2>
  <input type="text" id="cari" placeholder="Cari berdasarkan title">
  <div id="api-status" class="out">Memuat data...</div>
  <div id="api-list"></div>
  <button id="btn-prev">Previous</button>
  <span id="halaman"></span>
  <button id="btn-next">Next</button>

  <script>
    const $ = (id) => document.getElementById(id);

    function bacaStorage(kunci) {
      try { return JSON.parse(localStorage.getItem(kunci)) || []; }
      catch { return []; }
    }
    function simpanStorage(kunci, nilai) {
      localStorage.setItem(kunci, JSON.stringify(nilai));
    }

    // Dark mode
    if (localStorage.getItem("modulDark") === "1") document.body.classList.add("dark");
    $("btn-dark").addEventListener("click", () => {
      document.body.classList.toggle("dark");
      localStorage.setItem("modulDark", document.body.classList.contains("dark") ? "1" : "0");
    });

    // 1. Mahasiswa
    let daftarMhs = bacaStorage("modulMahasiswa");
    function renderMhs() {
      $("daftar-mhs").innerHTML = "";
      daftarMhs.forEach((m, i) => {
        const li = document.createElement("li");
        li.textContent = `${m.nama} (${m.nim}) `;
        const b = document.createElement("button");
        b.textContent = "Hapus";
        b.className = "danger";
        b.addEventListener("click", () => { daftarMhs.splice(i, 1); simpanStorage("modulMahasiswa", daftarMhs); renderMhs(); });
        li.appendChild(b);
        $("daftar-mhs").appendChild(li);
      });
    }
    $("btn-tambah-mhs").addEventListener("click", () => {
      const nama = $("m-nama").value.trim();
      const nim = $("m-nim").value.trim();
      if (nama.length < 3) { $("m-error").textContent = "Nama minimal 3 karakter."; return; }
      if (!/^\d{9}$/.test(nim)) { $("m-error").textContent = "NIM harus 9 digit angka."; return; }
      $("m-error").textContent = "";
      daftarMhs.push({ nama, nim });
      simpanStorage("modulMahasiswa", daftarMhs);
      $("m-nama").value = ""; $("m-nim").value = "";
      renderMhs();
    });
    renderMhs();

    // 2. Todo
    let todos = bacaStorage("modulTodos");
    function renderTodo() {
      $("daftar-todo").innerHTML = "";
      todos.forEach((t, i) => {
        const li = document.createElement("li");
        const cek = document.createElement("input");
        cek.type = "checkbox";
        cek.checked = t.selesai;
        cek.addEventListener("change", () => { t.selesai = cek.checked; simpanStorage("modulTodos", todos); renderTodo(); });
        const teks = document.createElement("span");
        teks.textContent = " " + t.teks + " ";
        if (t.selesai) teks.style.textDecoration = "line-through";
        const hapus = document.createElement("button");
        hapus.textContent = "Hapus";
        hapus.className = "danger";
        hapus.addEventListener("click", () => { todos.splice(i, 1); simpanStorage("modulTodos", todos); renderTodo(); });
        li.append(cek, teks, hapus);
        $("daftar-todo").appendChild(li);
      });
    }
    $("btn-todo").addEventListener("click", () => {
      const teks = $("todo-input").value.trim();
      if (!teks) return;
      todos.push({ teks, selesai: false });
      simpanStorage("modulTodos", todos);
      $("todo-input").value = "";
      renderTodo();
    });
    renderTodo();

    // 3. Fetch API
    const PER_HALAMAN = 5;
    let semuaPost = [];
    let halaman = 1;

    function dataTersaring() {
      const kata = $("cari").value.trim().toLowerCase();
      return semuaPost.filter((p) => p.title.toLowerCase().includes(kata));
    }
    function renderPost() {
      const data = dataTersaring();
      const totalHal = Math.max(1, Math.ceil(data.length / PER_HALAMAN));
      halaman = Math.min(halaman, totalHal);
      const potong = data.slice((halaman - 1) * PER_HALAMAN, halaman * PER_HALAMAN);

      $("api-list").innerHTML = "";
      potong.forEach((p) => {
        const div = document.createElement("div");
        div.className = "out";
        const judul = document.createElement("strong");
        judul.textContent = p.title;
        const isi = document.createElement("div");
        isi.textContent = p.body;
        div.append(judul, isi);
        $("api-list").appendChild(div);
      });
      $("api-status").textContent = `${data.length} post ditemukan.`;
      $("halaman").textContent = ` Halaman ${halaman} dari ${totalHal} `;
      $("btn-prev").disabled = halaman <= 1;
      $("btn-next").disabled = halaman >= totalHal;
    }
    async function ambilData() {
      try {
        const res = await fetch("https://jsonplaceholder.typicode.com/posts");
        if (!res.ok) throw new Error("Status " + res.status);
        semuaPost = await res.json();
        renderPost();
      } catch (error) {
        $("api-status").innerHTML = `<span class="err">Gagal mengambil data: ${error.message}</span>`;
      }
    }
    $("cari").addEventListener("input", () => { halaman = 1; renderPost(); });
    $("btn-prev").addEventListener("click", () => { halaman--; renderPost(); });
    $("btn-next").addEventListener("click", () => { halaman++; renderPost(); });
    ambilData();
  </script>
</body>
</html>
